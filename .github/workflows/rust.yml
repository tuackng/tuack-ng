name: Rust Build and Release

on:
  push:
    branches:
      - '**'
      - '!all-contributors/**'
    tags:
      - "*.*.*"

  pull_request:
    branches: [ "master" ]

  # 手动触发：用于补发/重发版本，或在未打 tag 时先构建出草稿 Release。
  #   * 在某个 tag 上触发并留空 `tag` → 用该 tag（github.ref_name），
  #     构建与发布都基于该 tag 的提交，适合重新发布历史版本。
  #   * 在分支上触发并填写 `tag` → 用填写的版本号，构建基于该分支，
  #     适合发布尚未打 tag 的新版本。
  workflow_dispatch:
    inputs:
      tag:
        description: '版本号（须有 doc/changelog/<版本号>.md）；留空则使用所选 ref'
        required: false
        type: string

env:
  CARGO_TERM_COLOR: always

jobs:
  build-linux:
    strategy:
      matrix:
        include:
          - runner: ubuntu-24.04
            artifact_suffix: x86_64
          - runner: ubuntu-24.04-arm
            artifact_suffix: arm64

    runs-on: ${{ matrix.runner }}

    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true

      - name: Install Dependencies
        run: cargo install cargo-deb --verbose

      - name: Build Release
        run: cargo build --release --verbose

      - name: Run tests
        run: cargo test --workspace

      - name: Pack deb
        run: |
          cargo deb -p tuack-ng
          mv target/debian/*.deb target/debian/tuack-ng-linux-${{ matrix.artifact_suffix }}.deb

      - name: Upload deb
        uses: actions/upload-artifact@v4
        with:
          name: output-linux-deb-${{ matrix.artifact_suffix }}
          path: target/debian/*.deb

      - name: Pack zip
        run: |
          mkdir -p pack/
          cp "target/release/tuack-ng" "pack/tuack-ng"
          cp -r "assets/" "pack/assets/"
          cd pack/
          zip -r "tuack-ng-linux-${{ matrix.artifact_suffix }}.zip" .
          cd ..

      - name: Upload zip
        uses: actions/upload-artifact@v4
        with:
          name: output-linux-zip-${{ matrix.artifact_suffix }}
          path: pack/tuack-ng-linux-${{ matrix.artifact_suffix }}.zip

  build-nix:
    strategy:
      matrix:
        include:
          - runner: ubuntu-24.04
            artifact_suffix: linux-x86_64
          - runner: ubuntu-24.04-arm
            artifact_suffix: linux-arm64
          - runner: macos-15
            artifact_suffix: darwin-arm64
    runs-on: ${{ matrix.runner }}

    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true

      - name: Install Nix
        uses: nixbuild/nix-quick-install-action@v31
        with:
          nix_conf: |
            keep-env-derivations = true
            keep-outputs = true

      - name: Build Nix
        run: |
          nix build .#tuack-ng -L

      - name: Pack zip
        run: zip -r "tuack-ng-nix-${{ matrix.artifact_suffix }}.zip" result/

      - name: Upload zip
        uses: actions/upload-artifact@v4
        with:
          name: output-nix-zip-${{ matrix.artifact_suffix }}
          path: tuack-ng-nix-${{ matrix.artifact_suffix }}.zip

  build-windows:
    runs-on: windows-latest
    strategy:
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            artifact_suffix: x86_64
          - target: i686-pc-windows-msvc
            artifact_suffix: x86

    steps:
    - uses: actions/checkout@v6
      with:
        submodules: true

    - name: Install Rust (Windows)
      uses: actions-rs/toolchain@v1
      with:
        profile: minimal
        toolchain: stable
        target: ${{ matrix.target }}

    - name: Build Release (Windows)
      run: cargo build --release --target ${{ matrix.target }} --verbose

    - name: Pack
      run: |
        New-Item -ItemType Directory -Force -Path pack/
        Copy-Item "target/${{ matrix.target }}/release/tuack-ng.exe" "pack/tuack-ng.exe" -Force
        Copy-Item "assets/" "pack/assets/" -Recurse -Force
        Compress-Archive -Path "pack/*" -DestinationPath "pack/tuack-ng-windows-${{ matrix.artifact_suffix }}.zip" -Force

    - name: Upload Windows binaries
      uses: actions/upload-artifact@v4
      with:
        name: output-windows-${{ matrix.artifact_suffix }}
        path: pack/tuack-ng-windows-${{ matrix.artifact_suffix }}.zip

  upload-doc:
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    steps:
    - uses: actions/checkout@v6
    - name: Upload Release doc
      uses: actions/upload-artifact@v4
      with:
        name: release-docs
        path: doc/changelog/${{ github.event.inputs.tag || github.ref_name }}.md

  release:
    needs: [build-linux, build-nix, build-windows, upload-doc]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'

    steps:
    - name: Download artifact
      uses: actions/download-artifact@v4
      with:
        path: .

    - name: Display structure of downloaded files
      run: ls -R .

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ github.event.inputs.tag || github.ref_name }}
        draft: true
        files: |
          ./output-linux-deb-*/*.deb
          ./output-linux-zip-*/*.zip
          ./output-windows-*/*.zip
        body_path: ./release-docs/${{ github.event.inputs.tag || github.ref_name }}.md
      env:
        GITHUB_TOKEN: ${{ secrets.GH_PAT }}
