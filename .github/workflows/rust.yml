name: CI

on:
  push:
    branches:
      - '**'
      - '!all-contributors/**'
  pull_request:
    branches: [ "master" ]

env:
  CARGO_TERM_COLOR: always

# 同一分支的新提交取消旧运行，只保留最新结果。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # 只有文档改动时不跑检查。分类脚本出错时按代码处理，宁可多跑不可少跑。
  changes:
    name: changes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      code: ${{ steps.classify.outputs.code }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: classify
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -eu
          if [ -z "$BASE_SHA" ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! paths=$(git diff --name-only "$BASE_SHA...HEAD"); then
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          printf '%s\n' "$paths" | .github/scripts/classify-changes.sh >> "$GITHUB_OUTPUT"

  # 提交信息决定 CHANGELOG 是否收录，用 GitHub 的 PR commits 列表检查，
  # 避免把 PR 分支 merge 进来的 base 提交也算进去。
  commit-lint:
    name: commit-lint
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check the commit titles
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -eu
          pattern='^(feat|fix|perf|refactor|docs|test|ci|build|chore|revert|release)(\([a-z0-9_/-]+\))?!?: .+'
          titles=$(mktemp)
          gh api "repos/$GH_REPO/pulls/$PR_NUMBER/commits?per_page=100" \
            --jq '.[].commit.message | split("\n")[0]' > "$titles"
          status=0
          while IFS= read -r subject; do
            [ -n "$subject" ] || continue
            if ! printf '%s\n' "$subject" | grep -Eq "$pattern"; then
              echo "::error::commit title does not follow the commit convention: $subject"
              status=1
            fi
          done < "$titles"
          exit "$status"

  # 格式、lint 与拼写和平台无关，只跑一次。工具链由 rust-toolchain.toml 决定。
  lint:
    name: lint
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      # rustup 目录不在 rust-cache 的缓存范围内；单独缓存，避免每个 job 重新下载工具链。
      - uses: actions/cache@v4
        with:
          path: ~/.rustup
          key: rustup-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml') }}
      # @master 读取仓库里的 rust-toolchain.toml（版本与组件都在该文件中）。
      - uses: dtolnay/rust-toolchain@master
      - uses: Swatinem/rust-cache@v2
        with:
          key: lint
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Install typos
        run: cargo install typos-cli --locked
      - name: Check spelling
        run: typos

  # Cargo.toml 的 rust-version 是 1.96；用真实工具链验证，而不是只写在清单里。
  msrv:
    name: msrv
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      # 1.96.0 是独立工具链，key 不跟 rust-toolchain.toml 走。
      - uses: actions/cache@v4
        with:
          path: ~/.rustup
          key: rustup-${{ runner.os }}-${{ runner.arch }}-msrv-1.96.0
      - uses: dtolnay/rust-toolchain@1.96.0
      - uses: Swatinem/rust-cache@v2
        with:
          key: msrv
      - name: Check with the MSRV
        run: cargo check --workspace --all-targets --locked

  # 测试覆盖每个发布平台，每个提交都跑。构建与发布由 release.yml 在 tag/nightly 上做。
  test:
    name: test
    needs: changes
    if: needs.changes.outputs.code == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            platform: linux-x86_64
          - runner: ubuntu-24.04-arm
            platform: linux-arm64
          - runner: windows-latest
            platform: windows-x86_64
          - runner: macos-15
            platform: macos-arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - uses: actions/cache@v4
        with:
          path: ~/.rustup
          key: rustup-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml') }}
      - uses: dtolnay/rust-toolchain@master
      - uses: Swatinem/rust-cache@v2
        with:
          key: test-${{ matrix.platform }}
      - name: Run tests
        run: cargo test --workspace --locked
