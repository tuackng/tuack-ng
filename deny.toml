# cargo-deny 配置。项目按 AGPL-3.0-or-later 分发，允许宽松许可证的依赖。
# 依赖中出现的 GPL 只通过 OR 分支引入（例如 GPL-2.0-only OR BSD-3-Clause），
# 可以选择宽松分支，因此 allow 列表只列宽松许可证与 AGPL 本身。
#
# `audit.yml` 每周运行一次。本地用 `cargo deny check`。

[advisories]
version = 2
# 允许 yanked 版本，但会提示。漏洞通过 ignore 或升级处理。
yanked = "warn"
ignore = [
  # basic-toml 与 unsafe-libyaml 已停止维护，没有可升级版本。
  "RUSTSEC-2026-0374",
  "RUSTSEC-2024-0449",
  # extism 1.41 固定 wasmtime 与 wasmtime-wasi 49.0.4。extism 升级到
  # 带 wasmtime 49.0.5+ 的版本后移除这四条。
  "RUSTSEC-2026-0420",
  "RUSTSEC-2026-0422",
  "RUSTSEC-2026-0423",
  "RUSTSEC-2026-0424",
]

[licenses]
version = 2
# 依赖的 license 字段有时是 SPDX 表达式，置信度不高。93% 是本项目依赖的实测下限。
confidence-threshold = 0.93
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-3.0",
  "Zlib",
  "MPL-2.0",
  "CC0-1.0",
  "Unlicense",
  "0BSD",
  "BSL-1.0",
  "CDLA-Permissive-2.0",
  "bzip2-1.0.6",
  "AGPL-3.0-only",
  "AGPL-3.0-or-later",
  "LGPL-2.1-or-later",
]

[bans]
# 同一 crate 出现多个版本时拒绝。下面的 skip 是上游固定、无法消除的版本。
multiple-versions = "deny"
wildcards = "deny"
skip = [
  { name = "base64", version = "=0.22.1" },
  { name = "block-buffer", version = "=0.10.4" },
  { name = "cpufeatures", version = "=0.2.17" },
  { name = "crypto-common", version = "=0.1.7" },
  { name = "digest", version = "=0.10.7" },
  { name = "getrandom", version = "=0.2.17" },
  { name = "getrandom", version = "=0.3.4" },
  { name = "hashbrown", version = "=0.16.1" },
  { name = "io-lifetimes", version = "=2.0.4" },
  { name = "r-efi", version = "=5.3.0" },
  { name = "rand", version = "=0.9.5" },
  { name = "rand_core", version = "=0.9.5" },
  { name = "redox_users", version = "=0.4.6" },
  { name = "sha2", version = "=0.10.9" },
  { name = "syn", version = "=1.0.109" },
  { name = "syn", version = "=2.0.119" },
  { name = "thiserror", version = "=1.0.69" },
  { name = "thiserror-impl", version = "=1.0.69" },
  { name = "toml", version = "=0.5.11" },
  { name = "toml", version = "=0.9.12" },
  { name = "toml_datetime", version = "=0.7.5" },
  { name = "wasm-encoder", version = "=0.258.3" },
  { name = "wast", version = "=35.0.2" },
  { name = "windows-sys", version = "=0.52.0" },
  { name = "winnow", version = "=0.7.15" },
  { name = "zstd", version = "=0.13.4" },
  { name = "zstd-safe", version = "=7.4.0" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
