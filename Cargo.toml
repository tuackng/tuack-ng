[workspace]
members = [
    "crates/tuack-ng",
    "crates/tuack-lib",
    "crates/tuack-config",
    "crates/tuack-utils",
    "crates/tuack-ng-parser",
    "crates/tuack-plugin-sdk",
]
resolver = "3"

[workspace.package]
version = "1.1.0-alpha.4"
edition = "2024"
rust-version = "1.96"
authors = ["Pulsar <Pulsar33550336@163.com>"]
license = "AGPL-3.0-or-later"
repository = "https://github.com/tuackng/tuack-ng"

[workspace.dependencies]
anstream = "1.0.0"
anyhow = { version = "1.0.104", features = ["backtrace"] }
bytesize = { version = "2.7.0", features = ["serde"] }
dunce = "1.0.5"
indexmap = { version = "2.14.2", features = ["serde"] }
log = "0.4.34"
owo-colors = "4.4.0"
path-clean = "1.0.1"
regex = "1.13.1"
serde = { version = "1.0.229", features = ["rc"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
serde_many = { version = "0.1.0", features = ["derive"] }
sysinfo = "0.39.6"
tempfile = "3.27.0"
tuack-ng-parser = { version = "1.0.4", path = "crates/tuack-ng-parser" }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true

[profile.debug-release]
inherits = "release"
lto = false
codegen-units = 16
strip = false
debug = 2
