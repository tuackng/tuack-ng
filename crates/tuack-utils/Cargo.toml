[package]
name = "tuack-utils"
description = "tuack-ng 具体实现（渲染器、导出器、运行器等）"
edition.workspace = true
version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
anyhow.workspace = true
indexmap.workspace = true
log.workspace = true
owo-colors.workspace = true
path-clean.workspace = true
regex.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_many.workspace = true
sysinfo.workspace = true
tempfile.workspace = true
tokio = { version = "1.54.1", features = [
    "macros",
    "process",
    "rt",
    "time",
] }
tuack-lib.workspace = true
tuack-config.workspace = true

autocorrect = "2.14.2"
extism = { version = "1.41.0", default-features = false, features = [
    "wasmtime-default-features",
] }
html-builder = "0.5.1"
lazy_static = "1.5.1"
minijinja = { version = "3.0.2", features = ["serde"] }
mlua = { version = "0.12.2", features = [
    "lua55",
    "serde",
    "send",
    "anyhow",
    "vendored",
] }
quick-xml = { version = "0.42.0", features = ["serialize"] }
semver = "1.0.28"
shellwords = "1.1.0"
strfmt = "0.2.6"
toml = "1.1.8"

[dependencies.tuack-ng-parser]
workspace = true
